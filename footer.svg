<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Build it. Ship it. Watch it. Improve it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame"><rect width="1200" height="150" rx="24"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="150" fill="#000000"/>
    <rect width="1200" height="150" fill="url(#grid)"/>
  </g>
  <rect x="1" y="1" width="1198" height="148" rx="24" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#e2e8f0"><tspan fill="#38bdf8">$ </tspan>echo 'Build it. Ship it. Watch it. Improve it.'</text>
  <line x1="425" y1="114" x2="775" y2="114" stroke="#1e293b" stroke-width="2"/>
  <circle cx="425" cy="114" r="6" fill="#1e293b" filter="url(#glow)"><animate attributeName="fill" values="#1e293b;#38bdf8;#1e293b" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle>
  <circle cx="495" cy="114" r="6" fill="#1e293b" filter="url(#glow)"><animate attributeName="fill" values="#1e293b;#38bdf8;#1e293b" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="565" cy="114" r="6" fill="#1e293b" filter="url(#glow)"><animate attributeName="fill" values="#1e293b;#38bdf8;#1e293b" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle>
  <circle cx="635" cy="114" r="6" fill="#1e293b" filter="url(#glow)"><animate attributeName="fill" values="#1e293b;#38bdf8;#1e293b" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="705" cy="114" r="6" fill="#1e293b" filter="url(#glow)"><animate attributeName="fill" values="#1e293b;#38bdf8;#1e293b" dur="3s" begin="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="775" cy="114" r="6" fill="#1e293b" filter="url(#glow)"><animate attributeName="fill" values="#1e293b;#38bdf8;#1e293b" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
</svg>
