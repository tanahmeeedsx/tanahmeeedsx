<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Tanjim Ahmed - Automating Reliable Infrastructure at Scale" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#000000"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="900" cy="150" r="460" fill="url(#halo)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="60" y="62" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="3" fill="#38bdf8">DEVOPS // CLOUD // AUTOMATION</text>
  <text x="56" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-1" fill="#ffffff">Tanjim Ahmed</text>
  <text x="60" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#94a3b8">Automating Reliable Infrastructure at Scale</text>
  <rect x="60.0" y="214" width="54.2" height="32" rx="16" fill="#020617" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="87.1" y="235" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1" fill="#cbd5e1">AWS</text>
  <rect x="124.2" y="214" width="82.4" height="32" rx="16" fill="#020617" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="165.4" y="235" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1" fill="#cbd5e1">DOCKER</text>
  <rect x="216.6" y="214" width="120.0" height="32" rx="16" fill="#020617" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="276.6" y="235" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1" fill="#cbd5e1">KUBERNETES</text>
  <rect x="346.6" y="214" width="110.6" height="32" rx="16" fill="#020617" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="401.9" y="235" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1" fill="#cbd5e1">TERRAFORM</text>
  <rect x="467.2" y="214" width="157.6" height="32" rx="16" fill="#020617" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="546.0" y="235" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1" fill="#cbd5e1">GITHUB ACTIONS</text>
  <line x1="690" y1="150" x2="1140" y2="150" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="690" cy="150" r="9" fill="#000000" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <text x="690" y="186" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#94a3b8">commit</text>
  <circle cx="780" cy="150" r="9" fill="#000000" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <text x="780" y="186" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#94a3b8">build</text>
  <circle cx="870" cy="150" r="9" fill="#000000" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <text x="870" y="186" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#94a3b8">test</text>
  <circle cx="960" cy="150" r="9" fill="#000000" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <text x="960" y="186" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#94a3b8">scan</text>
  <circle cx="1050" cy="150" r="9" fill="#000000" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <text x="1050" y="186" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#94a3b8">deploy</text>
  <circle cx="1140" cy="150" r="9" fill="#000000" stroke="#22c55e" stroke-width="2.5" filter="url(#glow)"/>
  <text x="1140" y="186" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#94a3b8">observe</text>
  <circle r="5" fill="#38bdf8" filter="url(#glow)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M690,150 H1140"/></circle>
  <circle r="5" fill="#38bdf8" filter="url(#glow)"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M690,150 H1140"/></circle>
  <circle cx="986" cy="58" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="1000" y="62" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1" fill="#22c55e">PIPELINE GREEN</text>
